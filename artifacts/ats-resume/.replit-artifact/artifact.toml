kind = "web"
previewPath = "/"
title = "ATS Resume Builder"
description = "A resume builder web app that helps job seekers create clean, ATS-optimized resumes. Users fill in their personal info, work experience, education, skills, and more — then preview and download a perfectly formatted, machine-readable PDF resume."
version = "1.0.0"
id = "artifacts/ats-resume"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22031

[services.development]
run = "pnpm --filter @workspace/ats-resume run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ats-resume", "run", "build" ]
serve = "static"
publicDir = "artifacts/ats-resume/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22031"
BASE_PATH = "/"
